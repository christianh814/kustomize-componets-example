apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: catalog-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/christianh814/kustomize-componets-example.git
    targetRevision: main
    path: doc/examples/apps/catalog/overlays/argocd
    kustomize:
      components:
        - ../../../../components/pod-security
        - ../../../../components/network-policy
  destination:
    server: https://kubernetes.default.svc
    namespace: catalog
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
